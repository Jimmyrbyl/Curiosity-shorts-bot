name: Curiosity Shorts Bot

on:
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Get project files
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install libraries
        run: pip install -r ./requirements.txt

      - name: Run video bot
        run: python main.py
      - name: Save generated script
        uses: actions/upload-artifact@v4
        with:
          name: generated-short
          path: |
            script.txt
            narration.mp3
