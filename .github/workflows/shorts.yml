
name: Curiosity Shorts Bot

on:
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Get project files
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install libraries
        run: pip install -r ./requirements.txt

      - name: Run video bot
        run: python main.py

      - name: Verify video
        run: |
          test -s curiosity-short.mp4
          ls -lh curiosity-short.mp4

      - name: Upload video only
        uses: actions/upload-artifact@v4
        with:
          name: curiosity-video
          path: curiosity-short.mp4
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Save supporting files
        uses: actions/upload-artifact@v4
        with:
          name: curiosity-project-files
          path: |
            script.txt
            narration.mp3
            background.png
          if-no-files-found: error
          retention-days: 7
